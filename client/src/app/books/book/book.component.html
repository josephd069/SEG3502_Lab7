
<section class="book-result">

  <p
    *ngIf="loading"
    class="message"
    role="status"
  >
    Recherche du livre en cours...
  </p>

  <p
    *ngIf="!loading && errorMessage"
    class="message error"
    role="alert"
  >
    {{ errorMessage }}
  </p>

  <article
    *ngIf="selectedBook as livre"
    class="book-card"
  >

    <span class="eyebrow">
      FICHE LIVRE · ID {{ livre.id }}
    </span>

    <h2>{{ livre.title }}</h2>

    <dl>

      <div>
        <dt>Catégorie</dt>
        <dd>{{ categoryLabel(livre.category) }}</dd>
      </div>

      <div>
        <dt>Titre</dt>
        <dd>{{ livre.title }}</dd>
      </div>

      <div>
        <dt>Prix</dt>
        <dd>{{ livre.cost }} $</dd>
      </div>

      <div *ngIf="livre.authors?.length">
        <dt>Auteurs</dt>
        <dd>{{ livre.authors | authornames }}</dd>
      </div>

      <div *ngIf="livre.year">
        <dt>Année</dt>
        <dd>{{ livre.year }}</dd>
      </div>

      <div *ngIf="livre.description">
        <dt>Description</dt>
        <dd>{{ livre.description }}</dd>
      </div>

    </dl>

  </article>

</section>
